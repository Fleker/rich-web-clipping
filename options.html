<!DOCTYPE html>
<html>
<head>
  <title>Web Clipper Settings</title>
  <style>
    body { font-family: sans-serif; padding: 1em; width: 400px; }
    div { margin-bottom: 1em; }
    label { display: block; margin-bottom: 0.5em; }
    input, textarea { width: 100%; box-sizing: border-box; }
    #status { color: green; }
  </style>
</head>
<body>
  <h1>Web Clipper Settings</h1>

  <div>
    <label for="vault">Obsidian Vault Name:</label>
    <input type="text" id="vault">
  </div>

  <div>
    <label for="filenames">Suggested File Names (one per line):</label>
    <textarea id="filenames" rows="5"></textarea>
  </div>

  <hr>

  <div>
    <label>AI Source:</label>
    <input type="radio" id="source-local" name="aiSource" value="local" checked style="width: auto;"> 
    <label for="source-local" style="display: inline;">Local (Chrome Built-in AI)</label>
    <br>
    <input type="radio" id="source-gemini" name="aiSource" value="gemini" style="width: auto;"> 
    <label for="source-gemini" style="display: inline;">External (Gemini Flash 3.0)</label>
  </div>

  <div id="gemini-api-key-container" style="display: none;">
    <label for="geminiApiKey">Gemini API Key:</label>
    <input type="password" id="geminiApiKey" placeholder="Enter your Gemini API Key">
    <small>Get one at <a href="https://aistudio.google.com/app/apikey" target="_blank">Google AI Studio</a></small>
  </div>

  <hr>

  <button id="save">Save Settings</button>
  <div id="status"></div>

  <div>
    <strong>Local model status:</strong>
    <span id="dl-stat"></span>
    <br><br>
    <button id="dl-btn">Download model</button>
    <span id="dl-progress"></span>
  </div>

  <!-- <div>
    Check <a href="chrome://on-device-internals/">On-device internals</a>
  </div> -->

  <script src="options.js"></script>
</body>
</html>
